<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="sporttv-token" content="%%SPORTTV_TOKEN%%">
  <title>Sport TV</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- Anmeldung -->
  <section id="login" class="login hidden">
    <form id="loginForm" class="login-box">
      <h1>Sport TV</h1>
      <p class="muted">Zugangsdaten Ihres Xtream-Codes-Anbieters</p>
      <label>Server-URL
        <input name="server" type="text" placeholder="http://anbieter.example:8080" required autocomplete="url">
      </label>
      <label>Benutzername
        <input name="username" type="text" required autocomplete="username">
      </label>
      <label>Passwort
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn primary">Anmelden</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>

  <!-- Hauptansicht -->
  <section id="app" class="app hidden">
    <nav class="rail" id="tabs">
      <div class="rail-logo" title="Sport TV"><svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#1fa2ff"/></linearGradient></defs><path d="M8 5.5v21a1.5 1.5 0 0 0 2.3 1.3l16.5-10.5a1.5 1.5 0 0 0 0-2.6L10.3 4.2A1.5 1.5 0 0 0 8 5.5Z" fill="url(#lg)"/></svg></div>
      <button data-tab="home" class="tab" title="Start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg><span class="tip">Start</span></button>
      <button data-tab="live" class="tab" title="Live TV"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="m8 3 4 4 4-4"/></svg><span class="tip">Live TV</span></button>
      <button data-tab="vod" class="tab" title="Filme"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M3 12h18"/></svg><span class="tip">Filme</span></button>
      <button data-tab="series" class="tab" title="Serien"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 8l2.5-5h3L6 8M11 8l2.5-5h3L14 8M19 8l1.5-3"/></svg><span class="tip">Serien</span></button>
      <button data-tab="fav" class="tab" title="Favoriten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9-9.2C1.6 7.1 4 4 7.2 4c2 0 3.4 1.1 4.8 2.7C13.4 5.1 14.8 4 16.8 4 20 4 22.4 7.1 21 10.8 19 15.6 12 20 12 20Z"/></svg><span class="tip">Favoriten</span></button>
      <button data-tab="cont" class="tab" title="Weiter ansehen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="tip">Weiter ansehen</span></button>
      <span class="rail-grow"></span>
      <button data-tab="settings" class="tab" title="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span class="tip">Einstellungen</span></button>
    </nav>

    <div class="shell">
    <header class="topbar">
      <label class="search-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" class="search" type="search" placeholder="Sender, Filme, Serien suchen ...  ( / )"></label>
      <div class="account">
        <span id="accountInfo" class="muted hidden"></span>
        <button id="filterBtn" class="pill-btn hidden" title="Länderfilter"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg><span class="lbl">Länderfilter</span></button>
        <button id="syncBtn" class="pill-btn hidden" title="Abgleich zwischen Mac und PC"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.5-8 6 6 0 0 1 11.6 1.5A3.5 3.5 0 0 1 17.5 18Z"/><path d="m9.5 13.5 2.5-2.5 2.5 2.5M12 11v5"/></svg><span class="lbl">Abgleich</span></button>
        <button id="logout" class="pill-btn icon-only hidden" title="Abmelden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg></button>
      </div>
    </header>

    <div id="home" class="home hidden"></div>

    <div class="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="content">
        <div class="list-col" id="listCol">
          <div class="content-head">
            <h2 id="listTitle"></h2>
            <span id="listCount" class="muted"></span>
            <select id="sortSel" class="search sort-sel hidden" title="Sortierung">
              <option value="year">Neueste zuerst</option>
              <option value="added">Zuletzt hinzugefügt</option>
              <option value="rating">Beste Bewertung</option>
              <option value="name">A–Z</option>
              <option value="provider">Reihenfolge des Anbieters</option>
            </select>
            <button id="imdbBtn" class="btn small hidden">IMDb</button>
            <div id="viewToggle" class="view-toggle hidden">
              <button data-view="list">Liste</button>
              <button data-view="grid">Programm</button>
            </div>
          </div>
          <div id="list" class="list"></div>
          <div id="listMore" class="list-more"></div>
        </div>

        <!-- Vorschau fuer Live TV -->
        <aside id="preview" class="preview hidden">
          <div class="video-slot" data-role="slot">
            <div class="slot-empty">Sender anklicken zum Abspielen.<br>Doppelklick = Vollbild</div>
          </div>
          <div class="pv-head">
            <div class="pv-title" data-role="title"></div>
            <div class="muted" data-role="sub"></div>
          </div>
          <div class="pv-actions">
            <button class="ibtn" data-role="prev" title="Vorheriger Sender (Pfeil hoch)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
            <button class="ibtn" data-role="next" title="Nächster Sender (Pfeil runter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <button class="ibtn" data-role="last" title="Letzter Sender (Taste Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></button>
            <button class="ibtn" data-role="fav" title="Favorit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8Z"/></svg></button>
            <button class="ibtn" data-role="full" title="Vollbild (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            <div class="more-wrap">
              <button class="ibtn" data-role="more" title="Weitere Optionen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>
              <div class="menu hidden" data-role="menu">
                <label class="menu-q hidden" data-qwrap><span>Qualität</span><select class="q-select hidden" data-role="quality" title="Qualität"></select></label>
                <button data-role="format" title="Format nur für diesen Sender wechseln (TS/HLS)">Format wechseln (nur dieser Sender)</button>
                <button data-role="opts" title="Puffer, Standardformat, Info-Anzeige (Taste I)">Wiedergabe-Einstellungen</button>
                <button data-role="stats">Info-Anzeige ein/aus (Taste I)</button>
                <button data-role="copy" title="Direktlink z. B. für VLC">Link kopieren</button>
              </div>
            </div>
          </div>
          <div class="player-msg" data-role="msg"></div>
          <div class="epg" data-role="epg"></div>
        </aside>
      </div>
    </div>
    </div>
  </section>

  <!-- Detailansicht Film / Serie -->
  <div id="detail" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="detail" title="Schließen">&times;</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- Player gross (Filme, Serien, Suche) -->
  <div id="player" class="overlay hidden">
    <div class="player-box" id="playerBox">
      <div class="player-head">
        <div>
          <div class="player-title" data-role="title"></div>
          <div class="muted" data-role="sub"></div>
        </div>
        <div class="player-actions">
          <button class="ibtn" data-role="prev" title="Vorheriger Sender (Pfeil hoch)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
          <button class="ibtn" data-role="next" title="Nächster Sender (Pfeil runter)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <button class="ibtn" data-role="last" title="Letzter Sender (Taste Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></button>
          <button class="ibtn" data-role="fav" title="Favorit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8Z"/></svg></button>
          <button class="ibtn" data-role="full" title="Vollbild (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <div class="more-wrap">
            <button class="ibtn" data-role="more" title="Weitere Optionen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>
            <div class="menu hidden" data-role="menu">
              <label class="menu-q hidden" data-qwrap><span>Qualität</span><select class="q-select hidden" data-role="quality" title="Qualität"></select></label>
              <button data-role="format" title="Format nur für diesen Sender wechseln (TS/HLS)">Format wechseln (nur dieser Sender)</button>
              <button data-role="opts" title="Puffer, Standardformat, Info-Anzeige (Taste I)">Wiedergabe-Einstellungen</button>
              <button class="hidden" data-role="compat" title="Datei über ffmpeg umwandeln (bei schwarzem Bild oder fehlendem Ton)">Kompatibilitätsmodus</button>
              <button class="hidden" data-role="vlc" title="In VLC auf diesem Rechner öffnen">In VLC öffnen</button>
              <button data-role="stats">Info-Anzeige ein/aus (Taste I)</button>
              <button data-role="copy" title="Direktlink z. B. für VLC">Link kopieren</button>
            </div>
          </div>
          <button class="ibtn" data-close="player" title="Schließen (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
      </div>
      <div class="video-slot big" data-role="slot"></div>
      <div class="player-msg" data-role="msg"></div>
      <div class="epg" data-role="epg"></div>
    </div>
  </div>

  <!-- Laenderfilter -->
  <div id="filterDlg" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="filterDlg" title="Schließen">&times;</button>
      <div id="filterBody"></div>
    </div>
  </div>

  <!-- Abgleich -->
  <div id="syncDlg" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="syncDlg" title="Schließen">&times;</button>
      <div id="syncBody"></div>
    </div>
  </div>

  <!-- IMDb -->
  <div id="imdbDlg" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="imdbDlg" title="Schließen">&times;</button>
      <div id="imdbBody"></div>
    </div>
  </div>

  <!-- Wiedergabe-Einstellungen -->
  <div id="playDlg" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="playDlg" title="Schließen">&times;</button>
      <div id="playBody"></div>
    </div>
  </div>

  <!-- Qualitaet / Konto -->
  <div id="qualDlg" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="qualDlg" title="Schließen">&times;</button>
      <div id="qualBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="vendor/mpegts.js"></script>
  <script src="app.js"></script>
</body>
</html>
