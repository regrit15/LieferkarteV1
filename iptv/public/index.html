<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sport TV</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- Anmeldung -->
  <section id="login" class="login hidden">
    <form id="loginForm" class="login-box">
      <h1>Sport TV</h1>
      <p class="muted">Zugangsdaten Ihres Xtream-Codes-Anbieters</p>
      <label>Server-URL
        <input name="server" type="text" placeholder="http://anbieter.example:8080" required autocomplete="url">
      </label>
      <label>Benutzername
        <input name="username" type="text" required autocomplete="username">
      </label>
      <label>Passwort
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn primary">Anmelden</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>

  <!-- Hauptansicht -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">Sport TV</div>
      <nav class="tabs" id="tabs">
        <button data-tab="live" class="tab active">Live TV</button>
        <button data-tab="vod" class="tab">Filme</button>
        <button data-tab="series" class="tab">Serien</button>
        <button data-tab="fav" class="tab">Favoriten</button>
      </nav>
      <input id="search" class="search" type="search" placeholder="Suchen ...">
      <div class="account">
        <span id="accountInfo" class="muted"></span>
        <button id="logout" class="btn small">Abmelden</button>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="content">
        <div class="content-head">
          <h2 id="listTitle"></h2>
          <span id="listCount" class="muted"></span>
        </div>
        <div id="list" class="list"></div>
        <div id="listMore" class="list-more"></div>
      </div>
    </div>
  </section>

  <!-- Detailansicht Film / Serie -->
  <div id="detail" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="detail" title="Schließen">&times;</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- Player -->
  <div id="player" class="overlay hidden">
    <div class="player-box">
      <div class="player-head">
        <div>
          <div id="playerTitle" class="player-title"></div>
          <div id="playerSub" class="muted"></div>
        </div>
        <div class="player-actions">
          <button id="prevCh" class="btn small" title="Vorheriger Sender (Pfeil hoch)">&#9650;</button>
          <button id="nextCh" class="btn small" title="Nächster Sender (Pfeil runter)">&#9660;</button>
          <button id="playerFav" class="btn small">Favorit</button>
          <button id="switchFormat" class="btn small" title="Bei Problemen anderes Stream-Format testen">Format</button>
          <button id="copyLink" class="btn small" title="Direktlink z. B. für VLC">Link kopieren</button>
          <button class="btn small" data-close="player">Schließen</button>
        </div>
      </div>
      <video id="video" controls autoplay playsinline></video>
      <div id="playerMsg" class="player-msg"></div>
      <div id="epg" class="epg"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="vendor/mpegts.js"></script>
  <script src="app.js"></script>
</body>
</html>
