<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="sporttv-token" content="%%SPORTTV_TOKEN%%">
  <title>Sport TV</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- Anmeldung -->
  <section id="login" class="login hidden">
    <form id="loginForm" class="login-box">
      <h1>Sport TV</h1>
      <p class="muted">Zugangsdaten Ihres Xtream-Codes-Anbieters</p>
      <label>Server-URL
        <input name="server" type="text" placeholder="http://anbieter.example:8080" required autocomplete="url">
      </label>
      <label>Benutzername
        <input name="username" type="text" required autocomplete="username">
      </label>
      <label>Passwort
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn primary">Anmelden</button>
      <p id="loginError" class="error"></p>
    </form>
  </section>

  <!-- Hauptansicht -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">Sport TV</div>
      <nav class="tabs" id="tabs">
        <button data-tab="live" class="tab active">Live TV</button>
        <button data-tab="vod" class="tab">Filme</button>
        <button data-tab="series" class="tab">Serien</button>
        <button data-tab="cont" class="tab">Weiter ansehen</button>
        <button data-tab="fav" class="tab">Favoriten</button>
      </nav>
      <input id="search" class="search" type="search" placeholder="Sender, Filme, Serien suchen ...  ( / )">
      <button id="filterBtn" class="btn small">Länderfilter</button>
      <div class="account">
        <span id="accountInfo" class="muted"></span>
        <button id="syncBtn" class="btn small">Abgleich</button>
        <button id="logout" class="btn small">Abmelden</button>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="content">
        <div class="list-col" id="listCol">
          <div class="content-head">
            <h2 id="listTitle"></h2>
            <span id="listCount" class="muted"></span>
            <select id="sortSel" class="search sort-sel hidden" title="Sortierung">
              <option value="year">Neueste zuerst</option>
              <option value="added">Zuletzt hinzugefügt</option>
              <option value="rating">Beste Bewertung</option>
              <option value="name">A–Z</option>
              <option value="provider">Reihenfolge des Anbieters</option>
            </select>
            <button id="imdbBtn" class="btn small hidden">IMDb</button>
            <div id="viewToggle" class="view-toggle hidden">
              <button data-view="list">Liste</button>
              <button data-view="grid">Programm</button>
            </div>
          </div>
          <div id="list" class="list"></div>
          <div id="listMore" class="list-more"></div>
        </div>

        <!-- Vorschau fuer Live TV -->
        <aside id="preview" class="preview hidden">
          <div class="video-slot" data-role="slot">
            <div class="slot-empty">Sender anklicken zum Abspielen.<br>Doppelklick = Vollbild</div>
          </div>
          <div class="pv-head">
            <div class="pv-title" data-role="title"></div>
            <div class="muted" data-role="sub"></div>
          </div>
          <div class="pv-actions">
            <button class="btn small" data-role="prev" title="Vorheriger Sender (Pfeil hoch)">&#9650;</button>
            <button class="btn small" data-role="next" title="Nächster Sender (Pfeil runter)">&#9660;</button>
            <button class="btn small" data-role="last" title="Letzter Sender (Taste Z)">&#8644; Letzter</button>
            <button class="btn small" data-role="full" title="Vollbild (F)">Vollbild</button>
            <select class="btn small q-select hidden" data-role="quality" title="Qualität"></select>
            <button class="btn small" data-role="fav">&#9733; Favorit</button>
            <button class="btn small" data-role="format" title="Bei Problemen anderes Stream-Format testen">Format</button>
            <button class="btn small" data-role="copy" title="Direktlink z. B. für VLC">Link</button>
          </div>
          <div class="player-msg" data-role="msg"></div>
          <div class="epg" data-role="epg"></div>
        </aside>
      </div>
    </div>
  </section>

  <!-- Detailansicht Film / Serie -->
  <div id="detail" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="detail" title="Schließen">&times;</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <!-- Player gross (Filme, Serien, Suche) -->
  <div id="player" class="overlay hidden">
    <div class="player-box" id="playerBox">
      <div class="player-head">
        <div>
          <div class="player-title" data-role="title"></div>
          <div class="muted" data-role="sub"></div>
        </div>
        <div class="player-actions">
          <button class="btn small" data-role="prev" title="Vorheriger Sender (Pfeil hoch)">&#9650;</button>
          <button class="btn small" data-role="next" title="Nächster Sender (Pfeil runter)">&#9660;</button>
          <button class="btn small" data-role="last" title="Letzter Sender (Taste Z)">&#8644; Letzter</button>
          <button class="btn small" data-role="full" title="Vollbild (F)">Vollbild</button>
          <select class="btn small q-select hidden" data-role="quality" title="Qualität"></select>
          <button class="btn small" data-role="fav">&#9733; Favorit</button>
          <button class="btn small" data-role="format" title="Bei Problemen anderes Stream-Format testen">Format</button>
          <button class="btn small hidden" data-role="compat" title="Datei über ffmpeg umwandeln (bei schwarzem Bild oder fehlendem Ton)">Kompatibilitätsmodus</button>
          <button class="btn small hidden" data-role="vlc" title="Film in VLC auf diesem Rechner öffnen">In VLC öffnen</button>
          <button class="btn small" data-role="copy" title="Direktlink z. B. für VLC">Link kopieren</button>
          <button class="btn small" data-close="player">Schließen</button>
        </div>
      </div>
      <div class="video-slot big" data-role="slot"></div>
      <div class="player-msg" data-role="msg"></div>
      <div class="epg" data-role="epg"></div>
    </div>
  </div>

  <!-- Laenderfilter -->
  <div id="filterDlg" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="filterDlg" title="Schließen">&times;</button>
      <div id="filterBody"></div>
    </div>
  </div>

  <!-- Abgleich -->
  <div id="syncDlg" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="syncDlg" title="Schließen">&times;</button>
      <div id="syncBody"></div>
    </div>
  </div>

  <!-- IMDb -->
  <div id="imdbDlg" class="overlay hidden">
    <div class="detail-box">
      <button class="close" data-close="imdbDlg" title="Schließen">&times;</button>
      <div id="imdbBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="vendor/mpegts.js"></script>
  <script src="app.js"></script>
</body>
</html>
